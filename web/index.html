<!doctype html>
<!--
  StreamEmber Trainer page (published to GitHub Pages; the trainer script opens it in the StreamEmber overlay).
  Markup, app.js and app.css: MHud 1.3.0 FiveM/RedM page (github.com/StreamEmberPlatform/mhud,
  integration/mhud/html), unchanged except that the kit is loaded from the CDN (jsDelivr, npm
  @streamemberplatform/mhud@1.3.0). trainer.js/trainer.css: StreamEmber overlay adapter, atlas and performance panel.
  catalog.js/menu.js/menu.css: the big trainer menu (RDR2 only; F5).
  Updating MHud: copy index.html/app.js/app.css of the new MHud version, keep these changes, bump the version.
-->
<html lang="tr" class="mh-nui">
<head>
<meta charset="utf-8">
<title>MHud</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@streamemberplatform/mhud@1.3.0/kit/css/mhud.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="trainer.css">
<link rel="stylesheet" href="menu.css">
</head>
<body class="mh" data-mh-theme="modern">
<div class="mh-screen" id="screen">
  <div class="mh-vignette" id="vignette"></div>
  <div class="mh-world" id="world"></div>
  <div class="mh-world" id="markers"></div>

  <!-- Üst orta: pusula -->
  <div class="mh-anchor mh-tc" id="top-center">
    <div class="mh-compass" id="compass"></div>
  </div>

  <!-- Üst sol: görev -->
  <div class="mh-anchor mh-tl" id="objective-host"></div>

  <!-- Üst sağ: para, aranma, toast -->
  <div class="mh-anchor mh-tr">
    <div class="mh-cash" id="cash">
      <div class="mh-cash__value"><small>$</small><b data-cash>0</b></div>
      <div class="mh-cash__bank"><i data-i="bank"></i><span id="bank">0</span></div>
    </div>
    <div class="mh-wanted x-not-frontier" id="wanted"><i data-i="star-f"></i><i data-i="star-f"></i><i data-i="star-f"></i><i data-i="star-f"></i><i data-i="star-f"></i></div>
    <div class="mh-toasts" data-mh="toasts" style="margin-top:12px"></div>
  </div>

  <!-- Sağ orta: ölüm akışı, eşya -->
  <div class="mh-anchor mh-mr" style="top:34%">
    <div class="mh-feed" data-mh="feed"></div>
    <div class="mh-pickups" data-mh="pickups" style="margin-top:18px"></div>
  </div>

  <!-- Sol orta: hediyeler (yayın) -->
  <div class="mh-anchor mh-ml" style="top:30%">
    <div class="mh-gifts" data-mh="gifts"></div>
  </div>

  <!-- Alt sol: oyunun minimap'inin sağında yaşam & konum -->
  <div class="mh-anchor x-vitals-anchor">
    <div class="mh-location" id="location">
      <span class="mh-location__dir" id="dir">K</span><span class="mh-vrule"></span>
      <div><div class="mh-location__street" id="street">—</div><div class="mh-location__zone" id="zone"></div></div>
    </div>
    <div class="mh-vitals x-not-frontier" style="--w:280px">
      <div class="mh-vitals__pair">
        <div class="mh-vital mh-t-health"><i data-i="heart-f"></i><div class="mh-bar" id="hp" data-critical="25"><i class="mh-bar__ghost"></i><i class="mh-bar__fill"></i></div></div>
        <div class="mh-vital mh-t-armor" id="armor-row"><i data-i="shield-f"></i><div class="mh-bar" id="ar"><i class="mh-bar__ghost"></i><i class="mh-bar__fill"></i></div></div>
      </div>
      <div class="mh-vital mh-t-stamina"><i data-i="bolt-f"></i><div class="mh-bar" id="st"><i class="mh-bar__fill"></i></div></div>
      <div class="mh-vital mh-t-oxygen mh-hidden" id="ox-row"><i data-i="lungs"></i><div class="mh-bar" id="ox"><i class="mh-bar__fill"></i></div></div>
    </div>
    <div class="mh-cores x-only-frontier">
      <div class="mh-core mh-t-health" data-mh-ring id="core-hp"><span class="mh-core__fill"></span><i data-i="heart-f"></i></div>
      <div class="mh-core mh-t-stamina" data-mh-ring id="core-st"><span class="mh-core__fill"></span><i data-i="run"></i></div>
      <div class="mh-core mh-t-special" data-mh-ring id="core-de"><span class="mh-core__fill"></span><i data-i="eye"></i></div>
    </div>
  </div>

  <!-- Alt orta: ilerleme, altyazı, başarım -->
  <div class="mh-anchor mh-bc" data-mh="progress" style="bottom:150px"></div>
  <div class="mh-anchor mh-bc" data-mh="subtitle" style="bottom:96px"></div>
  <div class="mh-anchor mh-bc" data-mh="achv" style="bottom:210px"></div>
  <div class="mh-anchor mh-tc" data-mh="announce" style="top:22%"></div>
  <div class="mh-anchor mh-tc" data-mh="levelup" style="top:13%"></div>
  <div class="mh-anchor mh-mc" data-mh="countdown"></div>

  <!-- Alt sağ: silah / araç -->
  <div class="mh-anchor mh-br">
    <div class="mh-weapon mh-hidden" id="weapon">
      <div class="mh-weapon__name"><span class="mh-weapon__reload mh-hidden" id="reload">Şarjör değişiyor</span><span class="mh-kicker" id="w-name"></span></div>
      <div class="mh-weapon__main"><span id="w-art"></span><div class="mh-weapon__ammo"><span class="mh-weapon__clip" id="clip">0</span><span class="mh-weapon__reserve">/ <span id="reserve">0</span></span></div></div>
      <div class="mh-pips" id="pips" style="width:200px;gap:2px"></div>
    </div>
    <div class="mh-flex mh-gap-5 mh-hidden" id="vehicle" style="align-items:flex-end">
      <div class="mh-col mh-gap-3" style="align-items:flex-end;padding-bottom:14px">
        <div class="mh-col" style="align-items:flex-end;gap:2px"><span class="mh-kicker" id="v-name" lang="en"></span><span class="mh-badge mh-num" id="v-plate"></span></div>
        <div class="mh-gauges">
          <div class="mh-gauge"><i data-i="gas"></i><div class="mh-bar mh-t-warn" id="fuel" data-critical="15"><i class="mh-bar__fill"></i></div></div>
          <div class="mh-gauge"><i data-i="engine"></i><div class="mh-bar mh-t-success" id="engine" data-critical="25"><i class="mh-bar__fill"></i></div></div>
        </div>
      </div>
      <div class="mh-speedo" id="speedo">
        <svg class="mh-speedo__dial" viewBox="0 0 240 240"></svg>
        <div class="mh-speedo__center"><span class="mh-speedo__value">0</span><span class="mh-speedo__unit" id="unit">KM/S</span><span class="mh-speedo__gear">N</span></div>
        <div class="mh-speedo__lamps">
          <span class="mh-lamp" id="l-lights" style="--tone-rgb:var(--mh-info-rgb)"><i data-i="sun"></i></span>
          <span class="mh-lamp" id="l-lock"><i data-i="lock"></i></span>
          <span class="mh-lamp" id="l-engine"><i data-i="engine"></i></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Menü katmanı (klasik liste) -->
  <div class="mh-anchor mh-tl mh-hidden" id="menu-host"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@streamemberplatform/mhud@1.3.0/kit/js/mhud-icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@streamemberplatform/mhud@1.3.0/kit/js/mhud.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@streamemberplatform/mhud@1.3.0/kit/js/mhud-social.js"></script>
<script src="trainer.js"></script>
<script src="app.js"></script>
<script src="catalog.js"></script>
<script src="menu.js"></script>
</body>
</html>
